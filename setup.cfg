[metadata]
name = versedb_talker
version = attr: versedb_talker.__version__
description = A VerseDB API talker for ComicTagger, a cross-platform GUI/CLI app for writing metadata to comic archives
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Reggio-Digital/versedb_talker
author = Reggio Digital
author_email = hello@reggiodigital.com
license = Apache-2.0
license_files = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Environment :: MacOS X
    Environment :: Plugins
    Environment :: Win32 (MS Windows)
    Environment :: X11 Applications :: Qt
    Intended Audience :: End Users/Desktop
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Multimedia :: Graphics
    Topic :: Other/Nonlisted Topic
    Topic :: Utilities
keywords =
    comictagger
    versedb
    comics
    comic
    manga
    metadata
    tagging
    tagger

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
exclude =
    tests
    testing

[options.entry_points]
comictagger.talker =
    versedb = versedb_talker.versedb:VerseDBTalker

[options.extras_require]
dev =
    flake8
    isort>=5.10
    mypy
    pytest>=7
    setuptools>=42
    wheel

[flake8]
extend-ignore = E501, A003
max_line_length = 120

[mypy]
check_untyped_defs = true
